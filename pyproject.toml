[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rastreo"
version = "0.1.0"
description = "Auditor de SEO técnico: rastrea una web entera y genera un informe HTML con los fallos ordenados por prioridad."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rubén Tur" }]
keywords = ["seo", "crawler", "auditoria", "robots.txt"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
rapido = ["lxml>=5"]
dev = ["pytest>=8"]

[project.urls]
Repositorio = "https://github.com/Ruben-Tur/auditor-seo"

[project.scripts]
rastreo = "rastreo.cli:main"

[tool.setuptools]
packages = ["rastreo"]

[tool.setuptools.package-data]
rastreo = ["plantillas/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
